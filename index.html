<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umami — Kitchen Log</title>
<meta name="theme-color" content="#1C1B19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitchen Log">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<!-- ==========================================================
     THE ONLY LINE TO EDIT.
     Paste the Apps Script Web app URL here (it ends /exec).
     If you ever redeploy and the URL changes, change it here
     and nowhere else — everyone's link keeps working.
     ========================================================== -->
<script>
  var APP_URL = "https://script.google.com/macros/s/AKfycbxN0VT2xg3sdBW3YZ5liikgd3M8sO32Pcfrn78jOPwns-83OdLjXsrmSzFSA1gw8HAYJw/exec";
</script>

<style>
  :root{ --ink:#1C1B19; --ember:#D8552F; --brass:#C8A24B; --red:#B23A2E;
         --paper:#F4F1EC; --mute:#8C857A; --line:#E3DDD3 }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);min-height:100vh;display:flex;
       align-items:center;justify-content:center;padding:24px;
       font-family:"Helvetica Neue",Arial,sans-serif}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;
        padding:44px 34px;max-width:420px;width:100%;text-align:center}
  .mark{font-family:Georgia,serif;font-size:27px;letter-spacing:.34em;
        text-transform:uppercase;text-indent:.34em}
  .tag{font-family:Georgia,serif;font-style:italic;font-size:13px;color:var(--red);
       margin-top:8px;display:inline-block;border-top:1px solid var(--red);padding-top:8px}
  .sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
       margin-top:20px}
  .load{margin-top:26px;font-size:14px;color:var(--mute)}
  .dots span{display:inline-block;width:6px;height:6px;border-radius:50%;
             background:var(--brass);margin:0 3px;animation:b 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
  a.go{display:inline-block;margin-top:22px;background:var(--ember);color:#fff;
       text-decoration:none;padding:13px 26px;border-radius:10px;font-weight:700;font-size:14.5px}
  .hint{font-size:11.5px;color:var(--mute);margin-top:16px;line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">Umami</div>
    <div class="tag">The Fifth Taste</div>
    <div class="sub">Kitchen Log</div>

    <div class="load">Opening<span class="dots"><span></span><span></span><span></span></span></div>
    <a class="go" id="go" href="#">Open the kitchen log</a>
    <div class="hint">If nothing happens, tap the button above.</div>
  </div>

<script>
  /* Carry any ?setup=… or #anchor through to the app, then go. */
  var target = APP_URL + (location.search || "") + (location.hash || "");
  document.getElementById("go").href = target;
  location.replace(target);
</script>
</body>
</html>
